# dsh-insert-context bundle layer.
# Three behaviours, all runtime-switchable from the Settings page:
#   1. `enabled` (on by default) is the master switch. Off means the plugin is
#      completely inert: no append, no rule injection, and steps are not counted,
#      so switching it back on resumes the schedule where it stopped.
#   2. Rule injection (`rules`): a rule is {start, every, repeat, text}. It fires
#      on start, start+every, … start+(repeat-1)*every — or forever, on every
#      `every`-th step from `start` on, when `repeat` is 0 (unlimited) — with
#      `{{step}}` in the text replaced by the current step number.
#   3. Append to user messages (`userAppend`, off by default). `appendFirstOnly`
#      (ON by default) turns it into a one-shot: only the first user message of
#      the conversation carries the sentence. `appendSubagents` (off by default)
#      decides whether the append also reaches messages sent to subagents (which
#      the dispatcher sends, but which are tagged as user messages).
# The Settings page overrides these at runtime; the values below are only the
# defaults, read once when the plugin is mounted (see README: changing them needs
# a restart + a new session).
- insert:
    - id: insert-context
      name: dsh-insert-context
      config:
        enabled: true
        rules:
          - start: 10
            every: 10
            repeat: 0
            text: '现在是第 {{step}} 步，注意任务收敛进度。'
        userAppend: false
        appendFirstOnly: true
        appendSubagents: false
        appendText: '[注：回复不复述过程，结构清晰可读性好。]'
